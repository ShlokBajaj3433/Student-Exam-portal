spring.application.name=restapi

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8081}

# ── Datasource (Supabase / PostgreSQL) ──────────────────────────────────────
# Set environment variables before starting:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
#   SPRING_DATASOURCE_USERNAME=postgres
#   SPRING_DATASOURCE_PASSWORD=<your-password>
# Backward-compatible aliases:
#   SUPABASE_DB_URL / SUPABASE_DB_USER / SUPABASE_DB_PASSWORD
# If neither set is present, fall back to an in-memory H2 database so the app can still boot.
spring.datasource.url=${SPRING_DATASOURCE_URL:${SUPABASE_DB_URL:jdbc:h2:mem:examportal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Default fetch type is LAZY; explicit here for clarity
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
# ── JWT ──────────────────────────────────────────────────────────────────────
# Base64-encoded HS256 key (256-bit minimum).
# Override at runtime via the APP_JWT_SECRET environment variable.
# The default below is safe for local development only — use a random secret in production.
app.jwt.secret=${APP_JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1kZWZhdWx0LWp3dC1zZWNyZXQta2V5LTMyYnl0ZQ==}
app.jwt.expiration-ms=86400000

# ── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.examportal=DEBUG
logging.level.org.springframework.security=INFO
