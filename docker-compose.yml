services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examportal
      POSTGRES_USER: ${SUPABASE_DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPABASE_DB_USER} -d examportal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: ./Backend
    ports:
      - "8081:8081"
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://db:5432/examportal
      SUPABASE_DB_USER: ${SUPABASE_DB_USER}
      SUPABASE_DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
